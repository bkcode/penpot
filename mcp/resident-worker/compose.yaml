# Merge with the official Penpot Compose file; no host browser or host ports are needed.
services:
  penpot-worker:
    build:
      context: ${PENPOT_WORKER_BUILD_CONTEXT:?Set absolute worker source directory}
      args:
        PENPOT_VERSION: ${PENPOT_VERSION:-2.18.5}
    image: penpot-resident-worker:local
    restart: unless-stopped
    init: true
    shm_size: 256m
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 20s
    environment:
      PENPOT_WORKER_BASE_URL: http://penpot-frontend:8080
      PENPOT_WORKER_FILE_ID: ${PENPOT_WORKER_FILE_ID:?Set target file ID}
      PENPOT_WORKER_PAGE_ID: ${PENPOT_WORKER_PAGE_ID:?Set target page ID}
      PENPOT_WORKER_TEAM_ID: ${PENPOT_WORKER_TEAM_ID:?Set target team ID}
      PENPOT_WORKER_CREDENTIALS_FILE: /run/secrets/worker-credentials
      PENPOT_WORKER_FAILURE_THRESHOLD: ${PENPOT_WORKER_FAILURE_THRESHOLD:-3}
      PENPOT_WORKER_RECOVERY_GRACE_MS: ${PENPOT_WORKER_RECOVERY_GRACE_MS:-150000}
      PENPOT_WORKER_TASK_BUDGET_MS: ${PENPOT_WORKER_TASK_BUDGET_MS:-150000}
    secrets:
      - worker-credentials
    networks:
      - penpot
    depends_on:
      - penpot-frontend
secrets:
  worker-credentials:
    file: ${PENPOT_WORKER_CREDENTIALS_FILE:?Set protected credentials JSON path}
