# Optional backend DNS repair for hosts using Fake-IP proxies. SSRF checks stay enabled.
services:
  penpot-dns:
    image: adguard/dnsproxy:v0.86.0@sha256:4d65bafbf246b206a1af35d4263a86c35451d957458c7836304199f1cd2c1535
    restart: unless-stopped
    command:
      - --listen=0.0.0.0
      - --port=53
      - --upstream=https://1.1.1.1/dns-query
      - --upstream=https://1.0.0.1/dns-query
      - --cache
      - --cache-max-ttl=300
      - --timeout=8s
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      penpot-dns:
        ipv4_address: ${PENPOT_DNS_ADDRESS:-172.30.250.53}
  penpot-backend:
    dns:
      - ${PENPOT_DNS_ADDRESS:-172.30.250.53}
    networks:
      - penpot
      - penpot-dns
    depends_on:
      - penpot-dns
networks:
  penpot-dns:
    ipam:
      config:
        - subnet: ${PENPOT_DNS_SUBNET:-172.30.250.0/24}
